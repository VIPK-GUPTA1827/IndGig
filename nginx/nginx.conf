# IndGig Production Nginx Reverse Proxy & Load Balancer Configuration
# Place this at /etc/nginx/sites-available/indgig on Ubuntu/Debian server
# Symlink to /etc/nginx/sites-enabled/indgig

# Upstream cluster pointing to PM2 cluster processes (Port 5000)
upstream indgig_backend_cluster {
    # Least connection algorithm: forwards request to the worker with fewest active connections
    least_conn;
    
    server 127.0.0.1:5000 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# Rate limiting zones to prevent DDoS and brute-force abuse
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# HTTP -> HTTPS Redirect (Handled seamlessly by Cloudflare SSL or Certbot)
server {
    listen 80;
    listen [::]:80;
    server_name api.indgig.com indgig.com www.indgig.com;

    # Certbot renewal challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production SSL Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.indgig.com;

    # SSL Certificates (Cloudflare Origin CA or Let's Encrypt)
    ssl_certificate /etc/ssl/certs/indgig_ssl.crt;
    ssl_certificate_key /etc/ssl/private/indgig_ssl.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;

    # Client payload bounds
    client_max_body_size 15M;
    client_body_buffer_size 128k;

    # Gzip Compression for high-throughput bandwidth savings
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        application/xml;

    # Cloudflare Real IP Restoration (Trust Cloudflare proxies)
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Assets Caching (Uploads / User avatars)
    location /uploads/ {
        alias /var/www/indgig/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # WebSocket Support (Socket.IO Real-time Chat & Notifications)
    location /socket.io/ {
        proxy_pass http://indgig_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Strict Auth Endpoint Rate Limiting
    location /api/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://indgig_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API Endpoint Proxying
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://indgig_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
